name: Build Birthday Reminder iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

    - name: Build iOS App
      run: |
        xcodebuild -project BirthdayReminder.xcodeproj \
          -scheme BirthdayReminder \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    - name: Upload Built App
      uses: actions/upload-artifact@v4
      with:
        name: BirthdayReminder-iOS-App
        path: ~/Library/Developer/Xcode/DerivedData/BirthdayReminder-*/Build/Products/Release-iphoneos/BirthdayReminder.app
        retention-days: 14
